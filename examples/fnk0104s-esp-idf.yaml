esphome:
  name: fnk0104s-sd-server
  friendly_name: FNK0104S SD Server

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - fatfs
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
    sdkconfig_options:
      CONFIG_FATFS_LFN_STACK: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

external_components:
  - source:
      type: local
      path: ../components

cyd_sd_http_server:
  id: cyd_sd_server
  port: 8080
  control_port: 32769
  mount_point: /sdcard
  format_if_mount_failed: false
  internal_pullups: true
  bus_width: 4
  clk_pin: GPIO38
  cmd_pin: GPIO40
  data0_pin: GPIO39
  data1_pin: GPIO41
  data2_pin: GPIO48
  data3_pin: GPIO47
  max_upload_size: 200MB
  api_key: !secret sd_server_api_key

